name: Workspace checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-raster.txt
      - run: npm ci
      - run: python -m pip install -r requirements-raster.txt
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolated-browser-diagnostics
          path: output/playwright/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: geoai-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build the image
        run: |
          docker compose config --quiet
          docker compose build
      - name: Start an isolated container workspace
        run: |
          docker compose up -d --wait --wait-timeout 120
          test "$(docker compose exec -T workspace id -u)" = "10001"
          docker compose exec -T workspace python -c "import rasterio, numpy, shapely, PIL; print('Raster dependencies loaded')"
          python3 deploy/docker/container_smoke.py seed
      - name: Verify data survives a container restart
        run: |
          docker compose restart workspace
          docker compose up -d --wait --wait-timeout 120
          python3 deploy/docker/container_smoke.py verify
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the disposable CI workspace
        if: always()
        run: docker compose down --volumes --remove-orphans
